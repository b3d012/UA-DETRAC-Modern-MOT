dataset:
  name: UA-DETRAC
  root_env: UA_DETRAC_ROOT
  root: null
  layout:
    images_dir: DETRAC-Images
    train_annotations_dir: DETRAC-Train-Annotations-XML
    test_annotations_dir: DETRAC-Test-Annotations-XML
    toolkit_glob: DETRAC-Toolkit*
  expected:
    train_sequences: 60
    test_sequences: 40
  manifest_path: data/manifests/ua_detrac_manifest.json
  split_policy:
    official_test_immutable: true
    validation_source: official_train_only
    split_unit: sequence
  bbox_format_internal: xyxy
  coordinate_policy: "Document conversion explicitly; never guess inclusive/exclusive pixel semantics."
  allowed_vehicle_classes:
    - car
    - bus
    - van
    - others
